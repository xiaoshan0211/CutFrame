<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="{{ token }}"><title>镜序 · 本地视频工作台</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/workflow.css"><script defer src="/static/workflow-details.js"></script><script defer src="/static/app.js"></script><script defer src="/static/shot-preview.js"></script><script defer src="/static/caption-fonts.js"></script><script defer src="/static/workflow.js"></script><link rel="stylesheet" href="/static/storyboard.css"><script defer src="/static/storyboard-core.js"></script><script defer src="/static/storyboard.js"></script><script defer src="/static/subtitle-board-core.js"></script><script defer src="/static/subtitle-board.js"></script><link rel="stylesheet" href="/static/ai-candidates.css"><script defer src="/static/review-dictation.js"></script><script defer src="/static/local-selection.js"></script><script defer src="/static/ai-candidates.js"></script></head>
<body>
<header><div class="brand"><b>镜序<span> / </span></b><span>本地视频工作台</span></div><nav><button class="tab active" data-view="compose">02 单条成片</button><button class="tab" data-view="exports">导出记录</button></nav><span class="local"><i></i> {{ access_label }} · 源素材只读</span></header>
<div id="notice" role="status"></div>
<main id="compose" class="view active"><section class="composition"><span class="eyebrow">MANUAL EDIT · SINGLE FILM</span><h1>你选镜头，工具执行</h1><p class="small">按顺序组装，导入现成配音、字幕和背景音乐。无自动选片，无批量任务。</p><div class="compose-grid"><div><div class="section-head"><h2>镜头顺序</h2><span id="film-duration" class="badge">0 秒</span></div><div id="shots" class="shots"><p class="hint">请在第四步选择镜头。</p></div><div class="form-grid"><label>城市工程名<input id="project-name" placeholder="例如：成都厨房验证"></label><label>已保存工程<select id="project-list"><option value="">选择工程</option></select></label></div><div class="button-row"><button id="save-project">保存工程</button><button id="load-project">打开工程</button></div></div><div class="film-settings"><h2>本地配音</h2><p class="small">松弛男 · 已确认的 G 版音色与节奏。文案仅在本机处理。</p><label>配音文案（最多500字）<textarea id="tts-text" rows="6" maxlength="500" placeholder="粘贴完整文案，生成后先试听"></textarea></label><button id="tts-generate">生成本地配音</button><p id="tts-status" class="small" role="status"></p><label>已生成配音<select id="tts-history"><option value="">选择试听记录</option></select></label><audio id="tts-player" controls preload="metadata" style="width:100%" hidden></audio><button id="tts-use" disabled>用作本工程配音</button><h2>声音与字幕</h2><label>现成配音 <input id="voice" type="file" accept=".wav,.mp3,.m4a,.aac"></label><p class="small" id="voice-info">未导入</p><label>字幕 SRT（UTF-8）<input id="subtitle" type="file" accept=".srt"></label><p class="small" id="subtitle-info">未导入</p><label>背景音乐<input id="music" type="file" accept=".wav,.mp3,.m4a,.aac"></label><p class="small" id="music-info">未导入</p><div class="form-grid"><label>配音开始 / 秒<input id="voice-offset" type="number" min="0" step=".01" value="0"></label><label>音乐素材入点 / 秒<input id="music-start" type="number" min="0" step=".01" value="0"></label><label>音乐音量 / %<input id="music-volume" type="number" min="0" max="100" value="12"></label><label>字幕偏移 / 秒<input id="subtitle-offset" type="number" step=".01" value="0"></label></div><h2>画面设置</h2><div class="form-grid"><label>画幅<select id="canvas"><option value="1080x1920">竖屏 1080 × 1920</option><option value="1920x1080">横屏 1920 × 1080</option></select></label><label>帧率<select id="fps"><option>30</option><option>25</option><option>24</option></select></label><label>画面适配<select id="fit"><option value="contain">完整显示 · 留黑边</option><option value="cover">铺满画面 · 居中裁切</option></select></label><label>原视频声音<select id="source-audio"><option value="mute">静音</option><option value="keep">保留（与配音混合）</option></select></label><label>字幕字号<input id="font-size" type="number" min="0.1" step="any" value="52"></label><label>字幕距底边 / 像素<input id="subtitle-bottom" type="number" min="0" max="600" value="180"></label></div><p class="hint">完整成片会重新编码。保留配音速度，音乐不自动循环；时长不足会提示。字幕按原文字与时间码导入。</p><button id="render-film" class="primary">渲染单条验证片 ↗</button></div></div><div id="film-result"></div></section></main>
<main id="exports" class="view"><section class="composition"><span class="eyebrow">LOCAL HISTORY</span><h1>导出记录</h1><div id="export-list"></div></section></main>
<footer id="job-panel" hidden><div><strong id="job-title">处理中</strong><span id="job-message"></span></div><progress id="progress" max="100" value="0"></progress><button id="cancel-job">取消任务</button></footer>
</body></html>
